name: Build Python to EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4 # Diperbarui ke v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Diperbarui ke v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon=Anfrec.ico rainfall_app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4 # Diperbarui ke v4 agar tidak error
      with:
        name: Aplikasi-Rainfall-EXE
        path: dist/*.exe
