name: Build Python to EXE

on:
  push:
    branches: [ main ] # Akan berjalan otomatis saat ada perubahan di branch 'main'
  workflow_dispatch: # Memungkinkan kamu menjalankan proses ini secara manual

jobs:
  build:
    runs-on: windows-latest # Menggunakan server Windows agar hasilnya format .exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # Sesuaikan dengan versi Python yang kamu gunakan

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        # Perintah ini akan membuat file .exe dengan ikon Anfrec.ico
        pyinstaller --noconfirm --onefile --windowed --icon=Anfrec.ico rainfall_app.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Aplikasi-Rainfall-EXE
        path: dist/*.exe
